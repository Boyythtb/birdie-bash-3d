<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <!-- Feathers Skirt -->
  <polygon points="26,22 74,22 59,58 41,58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Feather ribs -->
  <line x1="33" y1="22" x2="45" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="41" y1="22" x2="48" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="50" y1="22" x2="50" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="59" y1="22" x2="52" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="67" y1="22" x2="55" y2="58" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Rib ties -->
  <line x1="31" y1="36" x2="69" y2="36" stroke="#64748b" stroke-width="2"/>
  <line x1="37" y1="48" x2="63" y2="48" stroke="#64748b" stroke-width="2"/>
  <!-- Blue band -->
  <rect x="40" y="56" width="20" height="7" rx="2" fill="#0284c7"/>
  <!-- Cork dome -->
  <path d="M 40,63 A 10,10 0 0 0 60,63 Z" fill="url(#cork)" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Cork glint -->
  <circle cx="46" cy="67" r="2.5" fill="#ffffff"/>
</svg>
